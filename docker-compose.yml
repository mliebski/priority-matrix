services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Ollama runs natively on the box; inside the container the box is "host.docker.internal".
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8010}:8000"
    volumes:
      - data:/data

volumes:
  data:   # your list, goals and coaching conversations (one SQLite file)
