<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How the coach reaches a suggestion</title>
  <desc id="desc">Your item, its due date and your goals go to the local model. The model judges importance and urgency as yes, no or unsure, and writes a reason and the next question. The app applies fixed rules: the first reply is always a question, a square is suggested only when both are settled, and after three unclear answers the choice goes back to you. While anything is unclear, the coach asks one question and your answer goes back to the model. Finally you decide where the item goes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#23211c"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 15px; font-weight: 700; fill: #23211c; }
    .sub { font-size: 12.5px; fill: #4a463d; }
    .label { font-size: 12px; fill: #23211c; }
    .box { stroke: #b9b19e; stroke-width: 1; }
    .line { stroke: #23211c; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="960" height="330" rx="14" fill="#fbf9f4"/>

  <rect x="20" y="30" width="200" height="180" rx="10" fill="#ffffff" class="box"/>
  <text x="36" y="60" class="title">1. Your item</text>
  <text x="36" y="88" class="sub">The to-do text</text>
  <text x="36" y="108" class="sub">Its due date, if any</text>
  <text x="36" y="128" class="sub">Today's date</text>
  <text x="36" y="148" class="sub">Your goals from Settings</text>

  <rect x="260" y="30" width="200" height="180" rx="10" fill="#f4e8c8" class="box"/>
  <text x="276" y="60" class="title">2. Local model judges</text>
  <text x="276" y="88" class="sub">Important? yes / no / unsure</text>
  <text x="276" y="108" class="sub">Urgent? yes / no / unsure</text>
  <text x="276" y="128" class="sub">A short reason</text>
  <text x="276" y="148" class="sub">The next question</text>

  <rect x="500" y="30" width="200" height="180" rx="10" fill="#f6dfd6" class="box"/>
  <text x="516" y="60" class="title">3. App applies rules</text>
  <text x="516" y="88" class="sub">First reply: always a</text>
  <text x="516" y="106" class="sub">question</text>
  <text x="516" y="130" class="sub">Both settled: suggest</text>
  <text x="516" y="148" class="sub">the matching square</text>
  <text x="516" y="172" class="sub">3 unclear answers: hand</text>
  <text x="516" y="190" class="sub">the choice back to you</text>

  <rect x="740" y="30" width="200" height="180" rx="10" fill="#d9eadf" stroke="#2f5d50" stroke-width="2"/>
  <text x="756" y="60" class="title">4. You decide</text>
  <text x="756" y="88" class="sub">Accept the suggestion,</text>
  <text x="756" y="108" class="sub">push back in words,</text>
  <text x="756" y="128" class="sub">or pick any square.</text>
  <text x="756" y="156" class="sub">Nothing moves until</text>
  <text x="756" y="176" class="sub">you place it.</text>

  <line x1="222" y1="120" x2="258" y2="120" class="line" marker-end="url(#arrow)"/>
  <line x1="462" y1="120" x2="498" y2="120" class="line" marker-end="url(#arrow)"/>
  <line x1="702" y1="120" x2="738" y2="120" class="line" marker-end="url(#arrow)"/>

  <path d="M600 212 V266 H360 V214" class="line" marker-end="url(#arrow)"/>
  <text x="480" y="290" text-anchor="middle" class="label">While anything is unclear: the coach asks one question, and your answer goes back to the model</text>
</svg>
